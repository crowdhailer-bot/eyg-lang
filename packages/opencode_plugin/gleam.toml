name = "opencode_plugin"
version = "0.1.0"
target = "javascript"

description = "Run EYG in the opencode coding agent with every effect checked by a policy."
licences = ["Apache-2.0"]

[dependencies]
gleam_stdlib = ">= 0.44.0 and < 2.0.0"
eyg_analysis = ">= 2.0.0 and < 4.0.0"
eyg_hub = { path = "../gleam_hub" }
eyg_interpreter = ">= 8.0.0 and < 9.0.0"
eyg_ir = ">= 3.0.0 and < 4.0.0"
eyg_parser = ">= 0.4.0 and < 1.0.0"
filepath = ">= 1.1.2 and < 2.0.0"
gleam_javascript = ">= 1.0.0 and < 2.0.0"
loam = { path = "../loam" }
ogre = ">= 1.1.0 and < 2.0.0"
overlay = { path = "../overlay" }
touch_grass = { path = "../touch_grass" }

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
simplifile = ">= 2.4.0 and < 3.0.0"

[javascript]
runtime = "bun"
