name = "embed_js"
version = "0.1.0"
target = "javascript"

# Builds dist/eyg.mjs, EYG for JavaScript hosts that do not use Gleam.

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
eyg_analysis = { path = "../gleam_analysis" }
eyg_embed = { path = "../gleam_embed" }
eyg_hub = { path = "../gleam_hub" }
eyg_interpreter = ">= 8.0.0 and < 9.0.0"
eyg_ir = { path = "../gleam_ir" }
eyg_parser = ">= 0.5.2 and < 1.0.0"
gleam_javascript = ">= 1.0.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
ogre = ">= 1.1.0 and < 2.0.0"
overlay_llm = { path = "../overlay_llm" }

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
