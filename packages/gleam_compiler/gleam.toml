name = "eyg_compiler"
version = "0.1.0"
target = "javascript"

description = "EYG compiler that targets JavaScript."
licences = ["Apache-2.0"]
repository = { type = "github", user = "crowdhailer", repo = "eyg-lang", path = "packages/gleam_compiler", tag_prefix = "gleam_compiler-" }
links = [{ title = "Website", href = "https://eyg.run" }]

[dependencies]
gleam_stdlib = ">= 0.44.0 and < 2.0.0"
eyg_analysis = ">= 2.0.0 and < 3.0.0"
eyg_ir = ">= 3.0.0 and < 4.0.0"
eyg_parser = ">= 0.3.0 and < 1.0.0"
touch_grass = ">= 0.4.0 and < 1.0.0"

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
gleam_javascript = ">= 1.0.0 and < 2.0.0"
eyg_interpreter = ">= 7.0.0 and < 8.0.0"
soundness = { path = "../soundness" }
simplifile = ">= 2.2.0 and < 3.0.0"
gleam_json = ">= 3.0.2 and < 4.0.0"
dag_json = ">= 3.0.0 and < 4.0.0"

[javascript]
runtime = "bun"
