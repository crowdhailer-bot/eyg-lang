name = "gleam_opentui"
version = "0.1.0"
target = "javascript"
licences = ["Apache-2.0"]
repository = { type = "github", user = "CrowdHailer", repo = "eyg-lang", path = "packages/gleam_opentui" }
description = "Direct Gleam bindings to OpenTUI, including testing, clipboard and tree-sitter"

[dependencies]
gleam_stdlib = ">= 0.44.0 and < 2.0.0"
gleam_javascript = ">= 1.0.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"

[javascript]
runtime = "bun"
typescript_declarations = true

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
