name: test

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  POSTGRES_PASSWORD: banana-penguin-truck
  SECRET_KEY_BASE: word-button-noodle
  # Pinned to the latest published CLI release. Update when a new stable
  # release is published.
  EYG_RELEASED_CLI_VERSION: gleam_cli-v0.0.2

jobs:
  test-beam:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gleam: ["1.15.3"]
        otp: ["28.4"]
        rebar3: ["3.25"]
        package: [
          "gleam_analysis",
          "gleam_hub",
          "gleam_ir",
          "gleam_parser",
          "topological",
          "touch_grass",
          "untethered"
        ]
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{matrix.otp}}
          gleam-version: ${{matrix.gleam}}
          rebar3-version: ${{matrix.rebar3}}
      - run: gleam deps download
        shell: bash # Required for git deps
        working-directory: packages/${{matrix.package}}
      - name: Manifest is in sync
        # `gleam deps download` regenerates manifest.toml when its
        # contents drift from gleam.toml. A non-empty diff means the
        # committed manifest was stale.
        run: git diff --exit-code manifest.toml
        working-directory: packages/${{matrix.package}}
      - run: gleam build --warnings-as-errors
        working-directory: packages/${{matrix.package}}
      - run: gleam test
        working-directory: packages/${{matrix.package}}
      - run: gleam format --check src test
        working-directory: packages/${{matrix.package}}
  test-db:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gleam: ["1.15.3"]
        otp: ["28.4"]
        rebar3: ["3.25"]
    services:
      postgres:
        image: postgres:17
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{matrix.otp}}
          gleam-version: ${{matrix.gleam}}
          rebar3-version: ${{matrix.rebar3}}
      - run: gleam build --warnings-as-errors
        working-directory: packages/hub  
      - run: gleam dev migrate
        working-directory: packages/hub  
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          SECRET_KEY_BASE: ${{ env.SECRET_KEY_BASE }}
      - run: gleam test
        working-directory: packages/hub  
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          SECRET_KEY_BASE: ${{ env.SECRET_KEY_BASE }}
  test-bun:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gleam: ["1.15.3"]
        otp: ["28.4"]
        bun: ["1.3.13",]
        package: [
          "eyg_check",
          "gleam_analysis",
          "gleam_cli",
          "gleam_compiler",
          "gleam_hub",
          "gleam_ir",
          "gleam_interpreter",
          "gleam_parser",
          "gleam_x",
          "morph",
          "topological",
          "touch_grass",
          "untethered",
          "website"
        ]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{matrix.bun}}
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{matrix.otp}}
          gleam-version: ${{matrix.gleam}}
      - run: gleam deps download
        shell: bash # Required for git deps
        working-directory: packages/${{matrix.package}}
      - name: Manifest is in sync
        run: git diff --exit-code manifest.toml
        working-directory: packages/${{matrix.package}}
      - run: gleam build --target javascript --warnings-as-errors
        working-directory: packages/${{matrix.package}}
      - run: gleam test --target javascript --runtime bun
        working-directory: packages/${{matrix.package}}
      - run: gleam format --check src test
        working-directory: packages/${{matrix.package}}
  test-eyg-packages:
    name: test-eyg-packages (${{ matrix.cli }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cli: ["source", "released"]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28.4"
          gleam-version: "1.15.3"
      - name: Build the eyg CLI from HEAD
        if: matrix.cli == 'source'
        run: |
          ./bin/compile "" "$RUNNER_TEMP/bin/eyg"
          chmod +x "$RUNNER_TEMP/bin/eyg"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
        working-directory: packages/gleam_cli
      - name: Install the pinned released eyg CLI
        if: matrix.cli == 'released'
        run: |
          PATH="$HOME/.local/bin:$PATH" ./install.sh "$EYG_RELEASED_CLI_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Show selected eyg CLI
        run: |
          command -v eyg
          eyg --version
      - name: Run EYG package tests
        run: eyg script entry.eyg
